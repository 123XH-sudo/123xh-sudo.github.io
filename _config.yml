# =============================================================================
# Site settings
# =============================================================================
title: 困困困忙忙忙
email: 2972646005@qq.com
description: >-
  我的个人技术博客，分享编程、技术和生活。
url: "https://123XH-sudo.github.io"
baseurl: ""
repository: "123XH-sudo/123xh-sudo.github.io"
github_username: "123XH-sudo"

locale: zh-CN
timezone: Asia/Shanghai

# =============================================================================
# 作者信息（显示在侧边栏）
# =============================================================================
author:
  name     : "123XH"
  avatar   : "/assets/images/bio-photo.jpg"
  bio      : "全栈开发学习者，记录成长路上的点滴。"
  location : "中国"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/123XH-sudo"

# =============================================================================
# Build settings - 使用 GitHub Pages 兼容的 remote_theme
# =============================================================================
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default

# 分页设置
paginate: 5
paginate_path: /page:num/

# 搜索
search: true
search_full_content: true

# 文章摘要
teaser: /assets/images/default-teaser.jpg
words_per_minute: 200

# 页脚
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/123XH-sudo"

# =============================================================================
# 默认布局设置 —— 这是关键！
# =============================================================================
defaults:
  # 所有文章
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
      toc: true
      toc_sticky: true
  # 所有页面
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: true
      show_date: true

# =============================================================================
# 插件 —— github-pages 已内置 jekyll-remote-theme
# =============================================================================
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist

# =============================================================================
# 排除文件
# =============================================================================
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - README.md
  - .gitignore

include:
  - _pages
