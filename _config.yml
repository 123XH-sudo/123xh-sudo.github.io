# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: 困困困忙忙忙
email: 2972646005@qq.com
description: >-
  我的个人技术博客，分享编程、技术和生活。
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://123XH-sudo.github.io"
github_username: "123XH-sudo"

locale: zh-CN
timezone: Asia/Shanghai
date_format: "%Y-%m-%d"

# 作者信息（显示在侧边栏）
author:
  name     : "123XH"
  avatar   : "/assets/images/bio-photo.jpg"
  bio      : "全栈开发学习者，记录成长路上的点滴。"
  location : "中国"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/123XH-sudo"

# Build settings
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default  # 主题风格（default/dark/air/aqua/neon等）

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap

