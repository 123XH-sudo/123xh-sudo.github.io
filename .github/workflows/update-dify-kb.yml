name: sync-dify-kb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.event.after }} -- _posts/ | tee changed_files.txt
          echo "--- changed files ---"
          cat changed_files.txt

      - name: Upload to Dify
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "No _posts changes, skip"
            exit 0
          fi

          API_BASE="https://api.dify.ai/v1"
          DATASET_ID="2b024fe6-adef-4922-aa2b-bd63d73cb9a6"

          while IFS= read -r file; do
            filename=$(basename "$file")
            echo "Uploading: $filename"

            RESP=$(curl -s -w "\n%{http_code}" -X POST "$API_BASE/datasets/$DATASET_ID/document/create-by-file" \
              -H "Authorization: Bearer ${{ secrets.DIFY_API_KEY }}" \
              -F "file=@$file" \
              -F "indexing_technique=high_quality" \
              -F 'process_rule={"mode":"automatic","rules":{"pre_processing_rules":[{"id":"remove_extra_spaces","enabled":true},{"id":"remove_urls_emails","enabled":false}],"segmentation":{"separator":"##","max_tokens":1000}}}')

            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP $HTTP_CODE: $BODY"

            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::Upload $filename failed (HTTP $HTTP_CODE)"
            fi
          done < changed_files.txt

          echo "Sync done"