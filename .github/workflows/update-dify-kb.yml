name: sync-dify-kb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.event.after }} -- _posts/ | tee changed_files.txt
          echo "--- changed files ---"
          cat changed_files.txt

      - name: Upload to Dify
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "No _posts changes, skip"
            exit 0
          fi

          while IFS= read -r file; do
            filename=$(basename "$file")
            echo "Uploading: $filename"

            RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.KB_PROXY_URL }}" \
              -F "file=@$file")

            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP $HTTP_CODE: $BODY"

            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::Upload $filename failed (HTTP $HTTP_CODE)"
            fi
          done < changed_files.txt

          echo "Sync done"